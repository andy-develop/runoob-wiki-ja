<script>
var aid = 24529;
function coll() {
	$.post( '/wp-content/themes/runoob/option/user/userinfo.php', {aid:aid, action:"collarticle", opt:'add'},function( data ) {
		if(data.error==0) {
			$("#content").find("h1:first").find("a").attr("href","javascript:void(0);");
			$("#content").find("h1:first").find("img").attr("src","http://www.runoob.com/wp-content/themes/runoob/assets/img/coll2.png").css({width:32+"px",height:32+"px"});
		}
		alert(data.msg);
	},'json');
}

(function () {
    // 1. 仅 HTML 页面
    if (!document.contentType || !document.contentType.includes('text/html')) return;

    // 2. 容器判断
    var container = document.querySelector('.article-intro');
    if (!container) return;

    var h1 = container.querySelector('h1');
    if (!h1) return;

    // 3. URL 判断
    var url = window.location.href.toLowerCase();
    var version = null;

    if (url.includes('/python3/')) {
        version = 'Python3.x';
    } else if (url.includes('/python/')) {
        version = 'Python2.x';
    }

    if (!version) return;

    // 4. 防重复
    if (h1.querySelector('.py-version-badge')) return;

    // 5. 创建标签
    var badge = document.createElement('span');
    badge.className = 'py-version-badge';
    badge.innerText = version;

    // 6. 样式（核心：float 实现右上角）
    badge.style.float = 'right';
    badge.style.fontSize = '12px';
    badge.style.padding = '2px 8px';
    badge.style.borderRadius = '999px';

   // 自适应亮/暗色 + 渐变背景（增强版）
	badge.style.color = 'inherit';

	// 渐变背景（低透明度，不影响暗黑模式）
	if (version.includes('3')) {
		badge.style.background = 'linear-gradient(90deg, rgba(79,172,254,0.15), rgba(0,242,254,0.15))';
	} else {
		badge.style.background = 'linear-gradient(90deg, rgba(161,140,209,0.15), rgba(251,194,235,0.15))';
	}

	// 边框弱化（更精致）
	badge.style.border = '1px solid rgba(127,127,127,0.3)';

	// 提升可读性
	badge.style.opacity = '0.95';

    // 微调位置（更贴近“右上角”）
    badge.style.marginTop = '4px';
    badge.style.marginLeft = '10px';

    // 7. 插入到 h1 最前面（让 float 生效更稳定）
    h1.insertBefore(badge, h1.firstChild);

})();
</script>
