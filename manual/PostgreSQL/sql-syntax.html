<html xmlns="http://www.w3.org/1999/xhtml"><head><meta content="text/html; charset=utf-8" http-equiv="Content-Type"/><title>第4章 SQL構文</title><link href="stylesheet.css" rel="stylesheet" type="text/css"/><link href="pgsql-docs@postgresql.org" rev="made"/><meta content="DocBook XSL Stylesheets V1.79.1" name="generator"/><link href="sql.html" rel="prev" title="部分 II. SQL 语言"/><link href="sql-syntax-lexical.html" rel="next" title="4.1. 词法结构"/></head><body><div class="chapter" id="SQL-SYNTAX"><div class="titlepage"><div><div><h2 class="title">第4章 SQL構文</h2></div></div></div><a class="indexterm" id="idp5574144"></a><p>この章では、SQLの構文について説明します。これは、SQLを使用してデータを定義および変更する方法を具体的に紹介する以降の章を理解するための基礎となります。</p><p>また、すでにSQLに精通しているユーザーにも、この章を注意深く読むことをお勧めします。この章には、SQLデータベースで一貫して実装されていないもの、および<span class="productname">PostgreSQL</span>中特有の規則と概念。</p></div><script src="../../../lang-switcher.js"></script>
